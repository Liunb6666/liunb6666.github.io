    <title>逐梦志愿</title>

        tailwind.config = {
            theme: {

                        primary: '#4B5563',

                        light: '#E5E7EB',

                        sans: ['PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">

            .content-auto {

            }

            }
            .hover-lift {
                transition: transform 0.2s ease, background-color 0.2s ease;
            }

                transform: translateY(1px);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-gray-400 focus:border-gray-400 transition-all;
            }

                @apply px-2 py-0.5 rounded text-xs font-bold ml-1 bg-gray-500 text-white;
            }
            .nav-link {
                @apply text-gray-600 hover:text-gray-800 transition-colors text-sm font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-2xl mx-auto px-4">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center">
                    <i class="fa fa-graduation-cap text-gray-600 text-xl mr-2"></i>
                    <span class="text-lg font-bold text-gray-800">逐梦志愿</span>
                </div>
                <div class="flex items-center">
                    <a href="https://szeb.sz.gov.cn/szzkw/ztzl/szzkjsnlqfsxcx/" target="_blank" class="nav-link">
                        <i class="fa fa-external-link mr-1"></i>
                        官方查分
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <!-- 计算器卡片 -->
        <div class="bg-white rounded-2xl card-shadow p-6 mb-6">
            <h2 class="text-xl font-bold mb-2 text-center text-gray-800">智能志愿填报计算器</h2>
            <p id="countdown" class="text-center text-gray-600 mb-5 text-sm"></p>
            
            <!-- 各科分数输入 -->
            <div class="mb-5">
                <h3 class="text-base font-semibold mb-4 text-gray-700">输入各科成绩</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            语文 <span id="chineseGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="chinese" placeholder="0-120" min="0" max="120" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            数学 <span id="mathGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="math" placeholder="0-100" min="0" max="100" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            英语笔试 <span id="englishGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="english" placeholder="0-75" min="0" max="75" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                        <p class="text-xs text-gray-500 mt-1">总分已加上听说考试分数</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            物理 <span id="physicsGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="physics" placeholder="0-70" min="0" max="70" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            化学 <span id="chemistryGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="chemistry" placeholder="0-50" min="0" max="50" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            历史 <span id="historyGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="history" placeholder="0-70" min="0" max="70" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            道法 <span id="politicsGrade" class="grade-badge hidden"></span>
                        </label>
                        <input type="number" id="politics" placeholder="0-50" min="0" max="50" 
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">模考类型</label>
                        <select id="examType" class="w-full px-4 py-3 border border-gray-200 rounded-xl input-focus text-base">
                            <option value="longgang2">龙岗区二模</option>
                            <option value="futian2">福田区二模</option>
                            <option value="longhua2">龙华区二模</option>
                            <option value="luohu2">罗湖区二模</option>
                            <option value="longgang1">龙岗区一模</option>
                            <option value="futian1">福田区一模</option>
                            <option value="longhua1">龙华区一模</option>
                            <option value="luohu1">罗湖区一模</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- 总分和等级显示 -->
            <div class="bg-lighter rounded-xl p-5 mb-5 border border-gray-100">
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div>
                        <p class="text-xs text-gray-500 mb-1">最终总分</p>
                        <p id="finalTotal" class="text-2xl font-bold text-gray-700">-</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-1">总分等级</p>
                        <p id="totalGrade" class="text-lg font-bold text-gray-700">-</p>
                    </div>
                </div>
            </div>
            
            <button onclick="calculateAll()" 
                    class="w-full bg-gray-700 hover:bg-gray-800 text-white font-medium py-3.5 px-6 rounded-xl transition-all flex items-center justify-center text-base hover-lift">
                <i class="fa fa-calculator mr-2"></i>
                一键计算志愿方案
            </button>
            
            <!-- 结果区域 -->
            <div id="result" class="mt-6 hidden">
                <div class="border-t border-gray-100 pt-5">
                    <h3 class="text-lg font-bold mb-2 text-gray-700">你的专属志愿方案</h3>
                    <p class="text-xs text-gray-500 mb-4">冲刺 + 平行 + 保底，共12个志愿，点击编辑可更换学校</p>
                    <div id="volunteerList" class="space-y-3">
                        <!-- 志愿卡片将在这里生成 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-100 py-4 mt-6">
        <div class="max-w-2xl mx-auto px-4 text-center text-gray-500 text-xs">

                english: { 'A+':95, 'A':89, 'B+':76, 'B':46, 'C+':0, 'C':0 },
                physics: { 'A+':67, 'A':61, 'B+':52, 'B':36, 'C+':0, 'C':0 },

                history: { 'A+':67, 'A':62, 'B+':57, 'B':48, 'C+':0, 'C':0 },
                politics: { 'A+':47, 'A':42, 'B+':37, 'B':31, 'C+':0, 'C':0 },
                total: { 'A+':513, 'A':467, 'B+':415, 'B':326, 'C+':0, 'C':0 }
            },
            luohu2: {
                chinese: { 'A+':102.5, 'A':93.5, 'B+':84, 'C+':0, 'C':0 },
                math: { 'A+':94, 'A':79, 'B+':64, 'C+':0, 'C':0 },

                chemistry: { 'A+':47, 'A':42, 'B+':33.5, 'C+':0, 'C':0 },
                history: { 'A+':61.5, 'A':55.5, 'B+':49, 'C+':0, 'C':0 },
                politics: { 'A+':45, 'A':41, 'B+':37, 'C+':0, 'C':0 },
                total: { 'A+':498, 'A':446, 'B+':378.75, 'C+':0, 'C':0 }
            },
            longhua2: {
                chinese: { 'A+':106.5, 'A':99, 'B+':91.5, 'B':80.5, 'C+':57, 'C':0 },
                math: { 'A+':91, 'A':79, 'B+':67, 'B':50, 'C+':18, 'C':0 },
                english: { 'A+':94.65, 'A':87.1, 'B+':70.45, 'B':43.8, 'C+':20.2, 'C':0 },
                physics: { 'A+':66.5, 'A':60.75, 'B+':52.5, 'B':35.5, 'C+':16.5, 'C':0 },
                chemistry: { 'A+':49.5, 'A':47.5, 'B+':43.5, 'B':32, 'C+':12.5, 'C':0 },
                history: { 'A+':66.5, 'A':62, 'B+':57, 'B':49, 'C+':31.5, 'C':0 },
                politics: { 'A+':46.5, 'A':43.5, 'B+':40, 'B':36, 'C+':26, 'C':0 },
                total: { 'A+':512.3, 'A':472.2, 'B+':418.95, 'B':330.2, 'C+':194.9, 'C':0 }
            }
        };

        // 全局变量
        let currentEditIndex = -1;
        let currentFinalScore = 0;
        let currentExamType = '';
        let volunteers = [];

        // 初始化倒计时
        function initCountdown() {
            const now = new Date();
            const zhongkao = new Date('2026-06-01');
            const diff = zhongkao - now;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').textContent = `同学你好，现在距离志愿填报结束还有 ${days} 天`;
        }

        // 获取等级（修复：正确调用函数）
        function getGrade(score, lines) {
            if (!lines || score === 0) return 'C';
            for (const [grade, line] of Object.entries(lines)) {
                if (score >= line) {
                    return grade;
                }
            }
            return 'C';
        }

        // 更新等级显示
        function updateGrade(elementId, score, lines) {
            const element = document.getElementById(elementId);
            if (!element || score === 0) {
                if (element) element.classList.add('hidden');
                return;
            }
            const grade = getGrade(score, lines);
            let displayGrade = grade;

            if (elementId === 'totalGrade' && lines) {
                const grades = Object.entries(lines).sort((a, b) => b[1] - a[1]);
                let upper = Infinity;
                let lower = 0;
                for (let i = 0; i < grades.length; i++) {
                    if (grades[i][0] === grade) {
                        upper = i > 0 ? grades[i-1][1] : Infinity;
                        lower = grades[i][1];
                        break;
                    }
                }

                if (upper !== Infinity && lower !== 0) {
                    const range = upper - lower;
                    const position = score - lower;
                    const ratio = position / range;

                    if (ratio >= 0.66) {
                        displayGrade = `${grade}头部`;
                    } else if (ratio >= 0.33) {
                        displayGrade = `${grade}中部`;
                    } else {
                        displayGrade = `${grade}底部`;
                    }
                }
            }

            element.textContent = displayGrade;
            element.className = `grade-badge grade-${grade.replace('+', 'plus')}`;
            element.classList.remove('hidden');
        }

        // 更新计算
        function updateCalculation() {
            const examType = document.getElementById('examType').value;
            const currentLines = gradeLines[examType];

            const chinese = parseFloat(document.getElementById('chinese').value) || 0;
            const math = parseFloat(document.getElementById('math').value) || 0;
            const english = parseFloat(document.getElementById('english').value) || 0;
            const physics = parseFloat(document.getElementById('physics').value) || 0;
            const chemistry = parseFloat(document.getElementById('chemistry').value) || 0;
            const history = parseFloat(document.getElementById('history').value) || 0;
            const politics = parseFloat(document.getElementById('politics').value) || 0;

            const englishTotal = english + 20;
            const rawTotal = chinese + math + englishTotal + physics + chemistry + history + politics;
            const finalTotal = rawTotal - 8;

            document.getElementById('finalTotal').textContent = finalTotal.toFixed(0);

            if (currentLines) {
                updateGrade('chineseGrade', chinese, currentLines.chinese);
                updateGrade('mathGrade', math, currentLines.math);
                updateGrade('englishGrade', englishTotal, currentLines.english);
                updateGrade('physicsGrade', physics, currentLines.physics);
                updateGrade('chemistryGrade', chemistry, currentLines.chemistry);
                updateGrade('historyGrade', history, currentLines.history);
                updateGrade('politicsGrade', politics, currentLines.politics);
                updateGrade('totalGrade', finalTotal, currentLines.total);
            }
        }

        // 打开编辑弹窗
        function openEditModal(index, currentSchool) {
            currentEditIndex = index;
            const list = document.getElementById('schoolList');
            list.innerHTML = '';
            
            const sortedSchools = [...schools].sort((a, b) => b[currentExamType] - a[currentExamType]);
            
            sortedSchools.forEach(school => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `w-full text-left px-4 py-3 rounded-xl hover:bg-gray-100 transition-colors text-sm ${school.name === currentSchool.name ? 'bg-gray-100' : ''}`;
                item.innerHTML = `
                    <span class="font-medium text-gray-800">${school.name}</span>
                    <span class="text-gray-500 ml-2">(${school[currentExamType]}分)</span>
                `;
                item.onclick = function() {
                    selectSchool(school);
                };
                list.appendChild(item);
            });

            document.getElementById('editModal').classList.remove('hidden');
        }

        // 选择学校
        function selectSchool(selectedSchool) {
            if (selectedSchool && currentEditIndex >= 0) {
                const cards = document.querySelectorAll('#volunteerList > div');
                if (cards[currentEditIndex]) {
                    const card = cards[currentEditIndex];
                    const diff = currentFinalScore - selectedSchool[currentExamType];
                    
                    const titleEl = card.querySelector('h4');
                    const scoreEl = card.querySelector('p:nth-child(2)');
                    const diffEl = card.querySelector('p:nth-child(3)');
                    
                    titleEl.textContent = selectedSchool.name;
                    scoreEl.textContent = `学校分数线：${selectedSchool[currentExamType]}分`;
                    diffEl.textContent = `分差：${diff > 0 ? '+' : ''}${diff.toFixed(0)}分`;
                    
                    volunteers[currentEditIndex] = {
                        name: selectedSchool.name,
                        score: selectedSchool[currentExamType],
                        diff: diff,
                        type: volunteers[currentEditIndex].type,
                        typeText: volunteers[currentEditIndex].typeText
                    };
                }
            }
            
            closeEditModal();
        }

        // 关闭编辑弹窗
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentEditIndex = -1;
        }

        // 计算所有，生成志愿方案（修复：标准12个志愿）
        function calculateAll() {
            updateCalculation();

            const chinese = parseFloat(document.getElementById('chinese').value) || 0;
            const math = parseFloat(document.getElementById('math').value) || 0;
            const english = parseFloat(document.getElementById('english').value) || 0;
            const physics = parseFloat(document.getElementById('physics').value) || 0;
            const chemistry = parseFloat(document.getElementById('chemistry').value) || 0;
            const history = parseFloat(document.getElementById('history').value) || 0;
            const politics = parseFloat(document.getElementById('politics').value) || 0;

            if (chinese === 0 || math === 0 || english === 0 || physics === 0 || chemistry === 0 || history === 0 || politics === 0) {
                alert('请输入完整的各科成绩！');
                return;
            }

            const englishTotal = english + 20;
            const rawTotal = chinese + math + englishTotal + physics + chemistry + history + politics;
            const finalScore = rawTotal - 8;
            const examType = document.getElementById('examType').value;
            
            currentFinalScore = finalScore;
            currentExamType = examType;

            const rushSchools = [];
            const parallelSchools = [];
            const safeSchools = [];

            schools.forEach(school => {
                const score = school[examType];
                if (score === undefined) return;
                
                const diff = finalScore - score;

                // 优化：更合理的分差区间
                if (diff >= -20 && diff < 0) {
                    rushSchools.push({
                        name: school.name,
                        score: score,
                        diff: diff,
                        type: '冲',
                        typeText: '冲刺志愿，有机会录取'
                    });
                } else if (diff >= 0 && diff <= 15) {
                    parallelSchools.push({
                        name: school.name,
                        score: score,
                        diff: diff,
                        type: '平',
                        typeText: '平行志愿，录取概率较高'
                    });
                } else if (diff > 15 && diff <= 50) {
                    safeSchools.push({
                        name: school.name,
                        score: score,
                        diff: diff,
                        type: '保',
                        typeText: '保底志愿，基本可以录取'
                    });
                }
            });

            // 修复：标准12个志愿：冲3 + 平6 + 保3
            rushSchools.sort((a, b) => b.score - a.score);
            const finalRush = rushSchools.slice(0, 3);

            parallelSchools.sort((a, b) => b.score - a.score);
            const finalParallel = parallelSchools.slice(0, 6);

            safeSchools.sort((a, b) => a.score - b.score);
            const finalSafe = safeSchools.slice(0, 3);

            volunteers = [];
            volunteers = [...finalRush, ...finalParallel, ...finalSafe];

            const container = document.getElementById('volunteerList');
            container.innerHTML = '';

            if (volunteers.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">没有找到匹配的学校，请检查你的分数是否正确</p>';
            } else {
                volunteers.forEach((v, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-lighter rounded-xl p-4 hover-lift border border-gray-100';
                    
                    const orderText = ['第一', '第二', '第三', '第四', '第五', '第六', '第七', '第八', '第九', '第十', '第十一', '第十二'][index] + '志愿';
                    
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center">
                                <span class="text-xs font-medium text-gray-600 mr-2">${orderText}</span>
                                <h4 class="font-bold text-gray-800 text-sm">${v.name}</h4>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-gray-600 text-white">${v.type}</span>
                                <button onclick="openEditModal(${index}, volunteers[${index}])" class="text-gray-600 text-xs">
                                    <i class="fa fa-pencil"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-sm text-gray-600 space-y-1">
                            <p>学校分数线：${v.score}分</p>
                            <p>你的分数：${finalScore.toFixed(0)}分</p>
                            <p>分差：${v.diff > 0 ? '+' : ''}${v.diff.toFixed(0)}分</p>
                            <p class="text-xs text-gray-500">${v.typeText}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            document.getElementById('result').classList.remove('hidden');
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCountdown();

            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.addEventListener('input', updateCalculation);
            });

            document.getElementById('examType').addEventListener('change', updateCalculation);

            document.getElementById('editModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeEditModal();
                }
            });

            updateCalculation();
        });
    </script>
