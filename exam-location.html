        // ===================== 模考定位核心逻辑 =====================
        function calculateLocation() {
            // 获取输入值
            const scoreInput = document.getElementById('examScore');
            const examType = document.getElementById('locationExamType').value;
            const score = parseInt(scoreInput.value);
            
            // 验证输入
            if (isNaN(score) || score < 0 || score > 610) {
                alert('请输入有效的模考总分（0-610）');
                scoreInput.focus();
                return;
            }

            // 显示结果区域
            const resultArea = document.getElementById('locationResult');
            resultArea.classList.remove('hidden');

            // 1. 计算分数段
            let scoreRange = '';
            if (score >= 450) scoreRange = '高分段（450+）';
            else if (score >= 400) scoreRange = '中高分段（400-449）';
            else if (score >= 350) scoreRange = '中等分段（350-399）';
            else if (score >= 300) scoreRange = '中低分段（300-349）';
            else scoreRange = '低分段（<300）';
            document.getElementById('scoreRange').textContent = scoreRange;

            // 2. 估算全区排名（基于模考分数分布模型）
            let rankEstimate = '';
            const totalStudents = { // 各区模考参考人数（示例数据）
                longgang2: 18000, longgang1: 17500,
                futian2: 12000, futian1: 11800,
                longhua2: 10000, longhua1: 9800,
                luohu2: 8000, luohu1: 7800
            };
            const ratio = 1 - (score / 610); // 排名比例（简化模型）
            const rank = Math.ceil(totalStudents[examType] * ratio);
            rankEstimate = `${rank} 名左右（参考总人数：${totalStudents[examType]} 人）`;
            document.getElementById('rankEstimate').textContent = rankEstimate;

            // 3. 匹配学校区间
            // 筛选出分数低于等于输入分的学校
            const matchedSchools = schools.filter(school => school[examType] <= score)
                .sort((a, b) => b[examType] - a[examType]);

            // 确定学校区间
            let schoolRangeText = '';
            if (matchedSchools.length === 0) {
                schoolRangeText = '暂无匹配学校（分数偏低）';
            } else if (matchedSchools.length === schools.length) {
                schoolRangeText = '可匹配所有学校（分数极高）';
            } else {
                const topSchool = matchedSchools[0];
                const bottomSchool = matchedSchools[matchedSchools.length - 1];
                schoolRangeText = `${bottomSchool.name} - ${topSchool.name}`;
            }
            document.getElementById('schoolRange').textContent = schoolRangeText;

            // 4. 生成推荐学校列表
            generateSchoolRecommendations(matchedSchools, examType, score);
        }

        // 生成推荐学校列表
        function generateSchoolRecommendations(matchedSchools, examType, score) {
            const listContainer = document.getElementById('recommendSchoolList');
            listContainer.innerHTML = ''; // 清空原有内容

            if (matchedSchools.length === 0) {
                listContainer.innerHTML = '<div class="text-gray-500 text-center py-4">暂无推荐学校，请提升分数后重试</div>';
                return;
            }

            // 按排名分组推荐（冲/稳/保）
            const sortedSchools = [...matchedSchools].sort((a, b) => a['2025学校排名'] - b['2025学校排名']);
            
            // 取前20所学校（或全部）进行分组
            const recommendList = sortedSchools.slice(0, 20);
            const total = recommendList.length;
            const reach = recommendList.slice(0, Math.ceil(total * 0.3)); // 冲
            const stable = recommendList.slice(Math.ceil(total * 0.3), Math.ceil(total * 0.7)); // 稳
            const safe = recommendList.slice(Math.ceil(total * 0.7)); // 保

            // 生成DOM
            const createSchoolGroup = (title, schools) => {
                if (schools.length === 0) return '';
                
                let html = `<div class="mb-4">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">${title}</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
                
                schools.forEach(school => {
                    const gap = score - school[examType];
                    const gapText = gap >= 0 ? `（超${gap}分）` : `（差${-gap}分）`;
                    const boardingScore = school['2026住宿分估算'] === 0 ? '无住宿' : school['2026住宿分估算'];
                    const dayScore = school['2026走读分估算'] === 0 ? '无走读' : school['2026走读分估算'];
                    
                    html += `<div class="bg-lighter p-3 rounded-lg hover:bg-gray-100 transition-colors">
                        <div class="font-medium text-gray-800">${school.name}</div>
                        <div class="text-xs text-gray-600 mt-1">
                            模考分数线：${school[examType]}分 ${gapText}<br>
                            2026预估：住宿${boardingScore} | 走读${dayScore}<br>
                            2025排名：${school['2025学校排名']}
                        </div>
                    </div>`;
                });
                
                html += `</div></div>`;
                return html;
            };

            listContainer.innerHTML = `
                ${createSchoolGroup('冲刺院校（推荐）', reach)}
                ${createSchoolGroup('稳妥院校（推荐）', stable)}
                ${createSchoolGroup('保底院校（推荐）', safe)}
            `;
        }
